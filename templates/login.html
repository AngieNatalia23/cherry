<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Cherry</title>

    <!-- Bootstrap 5 CSS & Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
        }
        .login-card {
            max-width: 420px;
            width: 100%;
            border: none;
            border-radius: 15px;
        }
        .btn-cherry {
            background-color: #dc3545;
            color: #fff;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-cherry:hover {
            background-color: #bb2d3b;
            color: #fff;
        }
        .form-control:focus {
            border-color: #dc3545;
            box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.25);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="card login-card shadow-lg p-4 bg-white">
        <!-- Logo y Título -->
        <div class="text-center mb-4">
            <h1 class="text-danger fw-bold fs-2 mb-1">🍒 Cherry</h1>
            <p class="text-muted small">Ingresa tu correo y contraseña para acceder</p>
        </div>

        <!-- Mensajes Alerta (Flash) -->
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-danger alert-dismissible fade show p-2 text-center small mb-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ message }}
                <button type="button" class="btn-close btn-close-white p-2" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <!-- Formulario de Iniciar Sesión -->
        <form action="{{ url_for('login') }}" method="POST">
            <div class="mb-3">
                <label for="correo" class="form-label fw-semibold small text-secondary">Correo Electrónico</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-secondary"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="correo" id="correo" class="form-control" placeholder="ejemplo@gmail.com" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-semibold small text-secondary">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-secondary"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

           <div class="mb-3">
           <a href="{{ url_for('cambiar_password') }}" class="text-muted small text-decoration-none">¿Olvidaste tu contraseña?</a>
           </div>
            <button type="submit" class="btn btn-cherry w-100 py-2 shadow-sm">
                Iniciar Sesión <i class="bi bi-box-arrow-in-right ms-1"></i>
            </button>
        </form>

        <div style="text-align: center; margin-top: 15px; font-size: 0.85rem;">
            ¿No tienes una cuenta? <a href="/register" style="color: #e63946; font-weight: bold; text-decoration: none;">Regístrate aquí</a>
        </div>

        <!-- Pie de página de la tarjeta -->
        <div class="text-center mt-4 border-top pt-3">
            <a href="{{ url_for('index') }}" class="text-muted small text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i> Volver a la tienda
            </a>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
