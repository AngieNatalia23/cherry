<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cherry - Support Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .support-card { background: white; border-radius: 12px; transition: transform 0.2s, box-shadow 0.2s; border: none; }
        .support-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <div class="container my-5" style="max-width: 800px;">
        <div class="text-center mb-5">
            <h2 class="fw-bold">Centro de Soporte Cherry 🍒</h2>
            <p class="text-muted">¿Cómo podemos ayudarte hoy?</p>
        </div>

        <div class="row g-3">
            <div class="col-md-6">
                <a href="{{ url_for('faq') }}" class="text-decoration-none">
                    <div class="support-card p-4 d-flex align-items-center text-dark">
                        <i class="bi bi-headset fs-2 text-danger me-3"></i>
                        <div>
                            <h6 class="fw-bold mb-1">Support Center</h6>
                            <p class="text-muted small m-0">Encuentra respuestas a tus dudas frecuentes.</p>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-6">
                <a href="#" class="text-decoration-none">
                    <div class="support-card p-4 d-flex align-items-center text-dark">
                        <i class="bi bi-chat-dots fs-2 text-danger me-3"></i>
                        <div>
                            <h6 class="fw-bold mb-1">Chat with Cherry</h6>
                            <p class="text-muted small m-0">Habla con nuestro equipo de atención.</p>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-6">
                <a href="{{ url_for('privacidad') }}" class="text-decoration-none">
                    <div class="support-card p-4 d-flex align-items-center text-dark">
                        <i class="bi bi-shield-lock fs-2 text-danger me-3"></i>
                        <div>
                            <h6 class="fw-bold mb-1">Privacy Policy</h6>
                            <p class="text-muted small m-0">Conoce cómo protegemos tus datos.</p>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-6">
                <a href="{{ url_for('terminos') }}" class="text-decoration-none">
                    <div class="support-card p-4 d-flex align-items-center text-dark">
                        <i class="bi bi-file-earmark-text fs-2 text-danger me-3"></i>
                        <div>
                            <h6 class="fw-bold mb-1">Terms of Use</h6>
                            <p class="text-muted small m-0">Condiciones y reglas de la tienda.</p>
                        </div>
                    </div>
                </a>
            </div>
        </div>

        <div class="text-center mt-5">
            <a href="{{ url_for('index') }}" class="btn btn-dark rounded-pill px-4">Volver al Inicio</a>
        </div>
    </div>

</body>
</html>
