<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cambiar Contraseña | Cherry</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow p-4 rounded-4" style="width: 100%; max-width: 400px;">
        <h3 class="fw-bold text-center mb-3">Restablecer Contraseña</h3>
        
        <!-- Mensajes flash -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label for="correo" class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" id="correo" name="correo" required>
            </div>
            <div class="mb-3">
                <label for="nueva_password" class="form-label">Nueva Contraseña</label>
                <input type="password" class="form-control" id="nueva_password" name="nueva_password" required>
            </div>
            <button type="submit" class="btn btn-danger w-100 rounded-pill">Actualizar Contraseña</button>
        </form>
        <div class="text-center mt-3">
            <a href="{{ url_for('login') }}" class="text-muted small text-decoration-none">Volver al inicio de sesión</a>
        </div>
    </div>
</body>
</html>
